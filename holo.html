<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050914"><title>HOLO.01</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#dffaff;font-family:Arial,sans-serif}body{display:grid;place-items:center}.stage{position:relative;width:100%;height:100%;perspective:850px;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,rgba(18,117,160,.28),rgba(5,9,20,.91) 65%,rgba(5,9,20,.98))}.grid{position:absolute;inset:42% -20% -30%;transform:rotateX(68deg);background-image:linear-gradient(rgba(63,212,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(63,212,255,.14) 1px,transparent 1px);background-size:24px 24px;mask-image:linear-gradient(transparent,#000)}.core{position:absolute;left:50%;top:48%;width:116px;height:116px;transform:translate(-50%,-50%) rotateX(15deg);border-radius:50%;border:1px solid #62eaff;box-shadow:0 0 14px #19cfff,0 0 38px #087fae,inset 0 0 28px #0e9ec8;display:grid;place-items:center;animation:float 4s ease-in-out infinite}.core:before,.core:after{content:"";position:absolute;inset:-15px;border:1px solid rgba(88,228,255,.7);border-radius:50%;transform:rotateX(68deg) rotateZ(20deg)}.core:after{inset:-29px;transform:rotateX(68deg) rotateZ(-35deg);border-color:rgba(88,228,255,.35)}.orb{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,#66eaff 24%,#0b78b8 62%,#04142b);box-shadow:0 0 28px #43dfff}.panel{position:absolute;width:104px;padding:9px 8px;border:1px solid rgba(90,225,255,.65);background:linear-gradient(135deg,rgba(14,53,77,.88),rgba(5,15,31,.7));box-shadow:0 0 16px rgba(20,190,240,.2);border-radius:9px;font-size:10px;letter-spacing:1px;text-align:center;transform:rotateY(-14deg) rotateX(8deg);backdrop-filter:blur(8px)}.panel b{display:block;color:#6beaff;font-size:11px;margin-bottom:5px}.p1{left:5%;top:17%}.p2{right:5%;top:20%;transform:rotateY(14deg) rotateX(8deg)}.p3{left:4%;bottom:17%}.p4{right:4%;bottom:16%;transform:rotateY(14deg) rotateX(8deg)}.heading{position:absolute;top:15px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:4px;color:#82eaff}.sub{font-size:8px;letter-spacing:2px;color:#6596a9;margin-top:5px}.controls{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:5px;justify-content:center}.controls button{border:1px solid rgba(94,224,255,.55);background:rgba(5,23,40,.9);color:#c9f7ff;border-radius:20px;padding:8px 10px;font-size:9px;letter-spacing:1px}.status{position:absolute;bottom:45px;left:0;right:0;text-align:center;font-size:8px;color:#74bfd0;letter-spacing:2px}@keyframes float{0%,100%{margin-top:0}50%{margin-top:-9px}}.hidden{display:none!important}
</style></head><body><div class="stage"><div class="grid"></div><div class="heading">HOLO.01<div class="sub">SPATIAL CONTROL LAYER</div></div><div class="core" id="core"><div class="orb"></div></div><div class="panel p1" data-panel><b>VISION</b>TRACKING: STANDBY</div><div class="panel p2" data-panel><b>CONTROL</b>GESTURES: READY</div><div class="panel p3" data-panel><b>SYSTEM</b>OVERLAY: ACTIVE</div><div class="panel p4" data-panel><b>LINK</b>DEVICE: CONNECTED</div><div class="status" id="status">TOUCH CORE TO ROTATE · DRAG PANELS</div><div class="controls"><button id="panels">PANELS</button><button id="rotate">ROTATE</button><button id="reset">RESET</button></div></div>
<script>
const core=document.getElementById('core'), panels=[...document.querySelectorAll('[data-panel]')];let angle=0,drag=null;
core.addEventListener('click',()=>{angle+=35;core.style.transform=`translate(-50%,-50%) rotateX(15deg) rotateZ(${angle}deg)`;document.getElementById('status').textContent='CORE ROTATED'});
panels.forEach(p=>{p.addEventListener('touchstart',e=>{let t=e.touches[0],r=p.getBoundingClientRect();drag={p,x:t.clientX,y:t.clientY,left:r.left,top:r.top};p.style.right='auto';p.style.bottom='auto';p.style.left=r.left+'px';p.style.top=r.top+'px'},{passive:true});p.addEventListener('touchmove',e=>{if(!drag||drag.p!==p)return;let t=e.touches[0];p.style.left=(drag.left+t.clientX-drag.x)+'px';p.style.top=(drag.top+t.clientY-drag.y)+'px'},{passive:true});p.addEventListener('touchend',()=>drag=null)});
document.getElementById('panels').onclick=()=>panels.forEach(p=>p.classList.toggle('hidden'));
document.getElementById('rotate').onclick=()=>{angle+=20;core.style.transform=`translate(-50%,-50%) rotateX(15deg) rotateZ(${angle}deg)`};
document.getElementById('reset').onclick=()=>{location.reload()};
</script></body></html>
